project_id = "dbmitproxcogmtwfyhen"

# A função é chamada pelos triggers da BD (pg_net) com um segredo próprio
# (x-provision-secret), não com um JWT do Supabase — por isso desligamos a
# verificação de JWT. A autorização real é feita dentro da função.
[functions.provision-account]
verify_jwt = false

# AppyPay: o webhook é chamado pela AppyPay (sem JWT; validado pelo segredo no URL)
# e a função do painel usa o token de sessão do admin (x-admin-token), validado na BD.
# appypay-charge mantém a verificação de JWT: só utilizadores com sessão na app.
[functions.appypay-webhook]
verify_jwt = false

[functions.appypay-admin]
verify_jwt = false
